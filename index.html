function showTaps(){document.getElementById('tap-progress').innerHTML=Array.from({length:4},(_,i)=>'<i class="'+(i<entered.length?'done':'')+'"></i>').join('');document.getElementById('tap-progress').setAttribute('aria-label','已点击 '+entered.length+' 次，共四次');}
function say(text){const caption=document.getElementById('caption');caption.classList.toggle('female',text==='我想去英国。');document.getElementById('line').textContent=text;caption.classList.remove('pop');void caption.offsetWidth;caption.classList.add('pop');}
function finish(){timers.forEach(clearTimeout);timers=[];ready=true;stage.classList.remove('playing');stage.classList.add('ready');controls.hidden=false;document.getElementById('prelude').hidden=true;document.getElementById('increment').disabled=false;document.getElementById('confirm').disabled=false;if(document.getElementById('line').textContent!=='那请输入我们的密码是多少？')say('那请输入我们的密码是多少？');showTaps();}
function play(){timers.forEach(clearTimeout);entered=[];status.textContent='';ready=false;stage.classList.remove('playing','ready');void stage.offsetWidth;stage.classList.add('playing');controls.hidden=true;document.getElementById('prelude').hidden=false;document.getElementById('increment').disabled=true;document.getElementById('confirm').disabled=true;say('嘿，贝贝，今天我们去哪儿？');timers=[setTimeout(()=>say('我想去英国。'),1600),setTimeout(()=>say('那请输入我们的密码是多少？'),2500),setTimeout(finish,5000)];}
async function tap(side){if(!ready||busy)return;entered.push(side);status.textContent='';showTaps();if(entered.length===4)await unlock(entered.join(''));}
function reset(){if(busy)return;entered=[];status.textContent='';showTaps();}
async function unlock(password){busy=true;status.textContent='对暗号中…';try{if(!crypto.subtle||typeof DecompressionStream==='undefined')throw Error('browser');const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.data));const html=await new Response(new Blob([clear]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close();}catch(err){entered=[];showTaps();status.textContent=err.message==='browser'?'请用新版 Chrome、Safari 或 Edge 打开 HTTPS 网址。':'暗号没对上，再试一次吧。';busy=false;}}
document.getElementById('increment').onclick=()=>tap('L');document.getElementById('confirm').onclick=()=>tap('R');document.getElementById('reset').onclick=reset;document.getElementById('replay').onclick=()=>{if(!busy)play()};document.getElementById('skip').onclick=finish;play();
</script></body></html>
