const payload=JSON.parse(document.getElementById('encrypted-data').textContent),bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const stage=document.getElementById('stage'),controls=document.getElementById('controls'),status=document.getElementById('status');let entered=[],current=0,ready=false,busy=false,timers=[];
function showDigits(){document.getElementById('digits').innerHTML=Array.from({length:4},(_,i)=>'<span class="digit '+(i<entered.length?'done':i===entered.length?'current':'')+'">'+(i<entered.length?entered[i]:i===entered.length?current:'·')+'</span>').join('');}
function say(who,text){document.getElementById('speaker').textContent=who;document.getElementById('line').textContent=text;document.getElementById('caption').classList.toggle('female',who==='贝贝');}
function finish(){timers.forEach(clearTimeout);timers=[];ready=true;stage.classList.remove('playing');stage.classList.add('ready');controls.hidden=false;document.getElementById('prelude').hidden=true;document.getElementById('increment').disabled=false;document.getElementById('confirm').disabled=false;say('公老鼠','那请输入我们的密码是多少？');showDigits();}
function play(){timers.forEach(clearTimeout);ready=false;stage.classList.remove('playing','ready');void stage.offsetWidth;stage.classList.add('playing');controls.hidden=true;document.getElementById('prelude').hidden=false;document.getElementById('increment').disabled=true;document.getElementById('confirm').disabled=true;say('公老鼠','嘿，贝贝，今天我们去哪儿？');timers=[setTimeout(()=>say('贝贝','我想去英国。'),1600),setTimeout(()=>say('公老鼠','那请输入我们的密码是多少？'),2500),setTimeout(finish,5000)];}
function add(){if(!ready||busy)return;current=(current+1)%10;status.textContent='';showDigits();}
async function confirm(){if(!ready||busy)return;entered.push(current);current=0;showDigits();if(entered.length===4)await unlock(entered.join(''));}
function back(){if(busy)return;if(entered.length){current=entered.pop();}else current=0;status.textContent='';showDigits();}
function reset(){if(busy)return;entered=[];current=0;status.textContent='';showDigits();}
async function unlock(password){busy=true;status.textContent='对暗号中…';try{if(!crypto.subtle||typeof DecompressionStream==='undefined')throw Error('browser');const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.data));const html=await new Response(new Blob([clear]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.removeEventListener('keydown',keyboard);document.open();document.write(html);document.close();}catch(err){entered=[];current=0;showDigits();status.textContent=err.message==='browser'?'请用新版 Chrome、Safari 或 Edge 打开 HTTPS 网址。':'暗号没对上，再试一次吧。';busy=false;}}
function keyboard(ev){if(!ready||busy)return;if(ev.key==='ArrowUp'){ev.preventDefault();add()}if(ev.key==='Enter'&&!ev.target.closest('button,summary')){ev.preventDefault();confirm()}if(ev.key==='Backspace'){ev.preventDefault();back()}}
document.getElementById('increment').onclick=add;document.getElementById('confirm').onclick=confirm;document.getElementById('back').onclick=back;document.getElementById('reset').onclick=reset;document.getElementById('replay').onclick=()=>{if(!busy)play()};document.getElementById('skip').onclick=finish;document.addEventListener('keydown',keyboard);play();
</script></body></html>
